plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.17'
}

def sharedProperties = new Properties()
file('../gradle.properties').withInputStream { sharedProperties.load(it) }
def targets = [
    release: [minecraft: '26.3', forge: '66.0.10', loader: '66', range: '[66.0.10,67)'],
    lts: [minecraft: '26.1.2', forge: '64.1.3', loader: '64', range: '[64.1.3,65)']
]
def channel = providers.gradleProperty('channel').getOrElse('release')
if (!targets.containsKey(channel)) throw new GradleException('Forge supports release (26.3) and lts (26.1.2)')
def target = targets[channel]
version = "${sharedProperties.mod_version}+mc${target.minecraft}"
group = sharedProperties.maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets.main {
    java.srcDir '../src/client/java'
    java.srcDir "../src/compat/${target.minecraft == '26.1.2' ? '26.1.2' : 'modern'}/java"
    resources {
        srcDir '../src/main/resources'
        exclude 'fabric.mod.json'
    }
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${target.minecraft}-${target.forge}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty 'log4j2.configurationFile', file('src/test/resources/log4j2-test.xml').toURI().toString()
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', target.minecraft
    inputs.property 'forge_range', target.range
    inputs.property 'loader', target.loader
    def replacements = [version: project.version, minecraft: target.minecraft, forge_range: target.range, loader: target.loader]
    filesMatching('META-INF/mods.toml') { expand replacements }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar { manifest { attributes('MixinConfigs': 'worldnotes.mixins.json') } }
