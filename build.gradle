plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def targets = [
    release: [minecraft: '26.3', api: '0.162.0+26.3'],
    snapshot: [minecraft: '26.4-snapshot-3', api: '0.162.2+26.4'],
    legacy: [minecraft: '26.2', api: '0.161.0+26.2'],
    lts: [minecraft: '26.1.2', api: '0.155.3+26.1.2']
]
def channel = providers.gradleProperty('channel').getOrElse('release')
if (!targets.containsKey(channel)) throw new GradleException("Unknown channel '${channel}': use release, snapshot, legacy, or lts")
def target = targets[channel]
version = "${project.mod_version}+mc${target.minecraft}"
group = project.maven_group
base { archivesName = 'world-notes-fabric' }

loom {
    splitEnvironmentSourceSets()
    mods {
        "worldnotes" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets.client.java.srcDir 'src/fabric/java'
sourceSets.client.java.srcDir "src/compat/${target.minecraft == '26.1.2' ? '26.1.2' : 'modern'}/java"

dependencies {
    minecraft "com.mojang:minecraft:${target.minecraft}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${target.api}"
}

def modVersion = project.version
def minecraftDependency = target.minecraft

processResources {
    inputs.property "version", modVersion
    inputs.property "minecraft_dependency", minecraftDependency
    filesMatching("fabric.mod.json") {
        expand "version": modVersion, "minecraft_dependency": minecraftDependency
    }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
