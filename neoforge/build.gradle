plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

def sharedProperties = new Properties()
file('../gradle.properties').withInputStream { sharedProperties.load(it) }
def targets = [
    release: [minecraft: '26.3', neo: '26.3.0.69-beta', range: '[26.3.0.69-beta,26.4)'],
    lts: [minecraft: '26.1.2', neo: '26.1.2.116', range: '[26.1.2.116,26.1.3)']
]
def channel = providers.gradleProperty('channel').getOrElse('release')
if (!targets.containsKey(channel)) throw new GradleException('NeoForge supports release (26.3) and lts (26.1.2)')
def target = targets[channel]
version = "${sharedProperties.mod_version}+mc${target.minecraft}"
group = sharedProperties.maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
sourceSets.main {
    java.srcDir '../src/client/java'
    java.srcDir "../src/compat/${target.minecraft == '26.1.2' ? '26.1.2' : 'modern'}/java"
    resources {
        srcDir '../src/main/resources'
        exclude 'fabric.mod.json'
    }
}
neoForge {
    version = target.neo
    runs {
        client { client() }
    }
    mods {
        worldnotes { sourceSet(sourceSets.main) }
    }
}
repositories { mavenCentral() }

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', target.minecraft
    inputs.property 'neoforge_range', target.range
    def replacements = [version: project.version, minecraft: target.minecraft, neoforge_range: target.range]
    filesMatching('META-INF/neoforge.mods.toml') { expand replacements }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
